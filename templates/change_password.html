{% extends "base.html" %}
{% block title %}Change Password - Scouting App{% endblock %}
{% block body_class %}change-password-page{% endblock %}

{% block content %}
<form method="POST" class="change-password-card">
    <div class="card-header">
        <div class="card-logo">
            <div class="card-logo-icon">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                    <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                </svg>
            </div>
            <span class="card-logo-text">Account Security</span>
        </div>
        <div class="card-title">Change Password</div>
    </div>

    <div class="card-body">
        <div class="field">
            <label class="field-label" for="current_password">Current Password</label>
            <div class="input-wrap">
                <input type="password" id="current_password" name="current_password" placeholder="Enter current password" required autofocus>
                <button class="toggle-pw" type="button" onclick="togglePw('current_password', this)" aria-label="Toggle current password visibility">
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                        <circle cx="12" cy="12" r="3"/>
                    </svg>
                </button>
            </div>
        </div>

        <div class="field">
            <label class="field-label" for="new_password">New Password</label>
            <div class="input-wrap">
                <input type="password" id="new_password" name="new_password" placeholder="Create new password" oninput="checkStrength(this.value)" required>
                <button class="toggle-pw" type="button" onclick="togglePw('new_password', this)" aria-label="Toggle new password visibility">
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                        <circle cx="12" cy="12" r="3"/>
                    </svg>
                </button>
            </div>
            <div class="strength-bar"><div class="strength-fill" id="strength-fill"></div></div>
        </div>

        <div class="field">
            <label class="field-label" for="confirm_password">Confirm New Password</label>
            <div class="input-wrap">
                <input type="password" id="confirm_password" name="confirm_password" placeholder="Repeat new password" required>
                <button class="toggle-pw" type="button" onclick="togglePw('confirm_password', this)" aria-label="Toggle confirm password visibility">
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                        <circle cx="12" cy="12" r="3"/>
                    </svg>
                </button>
            </div>
        </div>

        <div class="divider"></div>
    </div>

    <div class="card-footer">
        <a class="link-back" href="{{ url_for('account_info') }}">Back to Account</a>
        <div class="footer-btns">
            <a class="btn-cancel" href="{{ url_for('account_info') }}">Cancel</a>
            <button class="btn-create-account" type="submit">Save Password</button>
        </div>
    </div>
</form>

<script>
    function togglePw(id, btn) {
        const input = document.getElementById(id);
        const isHidden = input.type === 'password';
        input.type = isHidden ? 'text' : 'password';
        btn.querySelector('svg').innerHTML = isHidden
            ? '<line x1="1" y1="1" x2="23" y2="23"/><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/>'
            : '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>';
    }

    function checkStrength(val) {
        const fill = document.getElementById('strength-fill');
        let score = 0;
        if (val.length >= 8) score++;
        if (/[A-Z]/.test(val)) score++;
        if (/[0-9]/.test(val)) score++;
        if (/[^A-Za-z0-9]/.test(val)) score++;
        const widths = ['0%', '25%', '50%', '75%', '100%'];
        const colors = ['#d65a44', '#d65a44', '#d79536', '#28a865', '#28a865'];
        fill.style.width = widths[score];
        fill.style.background = colors[score];
    }
</script>
{% endblock %}
