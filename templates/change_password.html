{% extends "base.html" %}
{% block title %}Change Password - Scouting App{% endblock %}
{% block body_class %}change-password-page{% endblock %}

{% block content %}
<a class="back-link" href="{{ url_for('account_info') }}">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="15 18 9 12 15 6"/></svg>
    Back to Account
</a>

<div class="page-head">
    <div class="page-title">Change Password</div>
    <div class="page-sub">Keep your account secure with a strong password.</div>
</div>

<div class="security-card">
    <form class="pw-form" method="POST" autocomplete="off">
        <div class="pw-field">
            <label class="pw-label" for="current_password">Current Password</label>
            <div class="pw-input-wrap">
                <input class="pw-input" type="password" id="current_password" name="current_password" placeholder="Enter current password" autocomplete="current-password" required autofocus>
                <button type="button" class="pw-eye" onclick="toggleEye('current_password', this)" aria-label="Show password">
                    <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/></svg>
                </button>
            </div>
        </div>

        <div class="pw-field">
            <label class="pw-label" for="new_password">New Password</label>
            <div class="pw-input-wrap">
                <input class="pw-input" type="password" id="new_password" name="new_password" placeholder="Enter new password" autocomplete="new-password" oninput="checkMatch()" required>
                <button type="button" class="pw-eye" onclick="toggleEye('new_password', this)" aria-label="Show password">
                    <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/></svg>
                </button>
            </div>
            <div class="pw-hint" id="newPwHint">Use at least 6 characters.</div>
        </div>

        <div class="pw-field">
            <label class="pw-label" for="confirm_password">Confirm New Password</label>
            <div class="pw-input-wrap">
                <input class="pw-input" type="password" id="confirm_password" name="confirm_password" placeholder="Re-enter new password" autocomplete="new-password" oninput="checkMatch()" required>
                <button type="button" class="pw-eye" onclick="toggleEye('confirm_password', this)" aria-label="Show password">
                    <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/></svg>
                </button>
            </div>
            <div class="pw-hint" id="confirmPwHint"></div>
        </div>

        <div class="pw-actions">
            <button type="submit" class="btn-save-pw">Update Password</button>
            <a class="btn-cancel-pw" href="{{ url_for('account_info') }}">Cancel</a>
        </div>
    </form>
</div>

<script>
  function toggleEye(id, btn) {
    const input = document.getElementById(id);
    const show = input.type === 'password';
    input.type = show ? 'text' : 'password';
    btn.innerHTML = show
      ? '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-10-7-10-7a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 10 7 10 7a18.5 18.5 0 0 1-2.16 3.19M1 1l22 22M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg>'
      : '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/></svg>';
  }

  function checkMatch() {
    const newPw = document.getElementById('new_password').value;
    const confirmPw = document.getElementById('confirm_password').value;
    const confirmHint = document.getElementById('confirmPwHint');
    const confirmInput = document.getElementById('confirm_password');

    if (!confirmPw) {
      confirmHint.textContent = '';
      confirmHint.classList.remove('error');
      confirmInput.classList.remove('error');
      return;
    }
    if (newPw !== confirmPw) {
      confirmHint.textContent = 'Passwords do not match.';
      confirmHint.classList.add('error');
      confirmInput.classList.add('error');
    } else {
      confirmHint.textContent = 'Passwords match.';
      confirmHint.classList.remove('error');
      confirmInput.classList.remove('error');
    }
  }
</script>
{% endblock %}
